spring.application.name=AminalReport

# Banco PostgreSQL local. Padroes abaixo; para mudar sem editar o arquivo use as variaveis de ambiente
# DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/animalreportdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8080

# create-drop recria o banco a cada execucao (bom para desenvolvimento e demonstracao).
# Para manter os dados entre execucoes: DDL_AUTO=update (ver corrigir-banco-local.sql se o banco ja existia).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false

# Classificacao automatica de urgencia: agente Python (classificador-urgencia), porta 8000.
# O modo do agente (regras, llm ou hibrido) e escolhido la, por URGENCIA_MODO.
urgencia.agente-url=${URGENCIA_AGENTE_URL:http://localhost:8000}
urgencia.agente-token=${URGENCIA_AGENTE_TOKEN:}
urgencia.prazo-maximo-segundos=180
urgencia.limiar-confianca=0.6
# De quanto em quanto tempo o sistema procura classificacoes que passaram do prazo maximo.
urgencia.verificacao-intervalo-ms=30000
