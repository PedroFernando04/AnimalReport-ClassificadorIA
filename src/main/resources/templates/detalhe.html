<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>AR - Detalhes da Denúncia</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>
<div th:replace="~{fragments/alerta :: alerta}"></div>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="page-section">

    <div class="container">

        <!-- BOTÃO VOLTAR -->

        <div class="mb-4">

            <a th:href="@{${voltarPara}}"
               class="btn btn-outline-light rounded-pill px-4 py-2">

                ← Voltar para Lista

            </a>

        </div>

        <!-- CARD PRINCIPAL -->

        <div class="detail-page-card">

            <!-- TOPO -->

            <div class="text-center mb-5">

                <h1 class="detail-page-title">
                    Detalhes da Denúncia
                </h1>

                <p class="detail-page-subtitle">
                    Informações completas sobre a denúncia registrada.
                </p>

            </div>

            <div class="row g-5 align-items-start">

                <!-- FOTO -->

                <div class="col-lg-5">

                    <div th:if="${denuncia.imagemUrl != null}"
                         class="detail-image-wrapper">

                        <img th:src="${denuncia.imagemUrl}"
                             class="detail-image"
                             alt="Foto do Animal">

                    </div>

                    <!-- BOTÃO ASSUMIR DENÚNCIA -->

                    <div th:if="${usuarioLogado.tipoUsuario == 'Organizacao' && denuncia.organizacaoResponsavel == null}"
                         class="mt-4 text-center">

                        <form th:action="@{/denuncia/assumir/{id}(id=${denuncia.id})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-success btn-lg px-4 rounded-pill">

                                <i class="bi bi-check-circle me-2"></i>
                                Assumir Denúncia

                            </button>

                        </form>

                    </div>

                    <div th:if="${denuncia.organizacaoResponsavel != null}"
                         class="alert alert-success mt-4">

                        <strong>Responsável:</strong>
                        <span th:text="${denuncia.organizacaoResponsavel.nome}"></span>

                    </div>

                    <!-- CORREÇÃO DO NÍVEL DE URGÊNCIA (só a organização responsável; o backend confere de novo) -->

                    <div th:if="${usuarioLogado.tipoUsuario == 'Organizacao' && denuncia.organizacaoResponsavel != null && denuncia.organizacaoResponsavel.id == usuarioLogado.id}"
                         class="detail-info-card mt-4"
                         id="correcao-urgencia">

                        <h3 class="detail-section-title">Corrigir nível de urgência</h3>

                        <form th:action="@{/denuncia/urgencia/{id}(id=${denuncia.id})}"
                              method="post">

                            <label for="nivelUrgencia" class="form-label">Novo nível</label>

                            <select class="form-select mb-3" id="nivelUrgencia" name="nivel" required>
                                <option th:each="n : ${T(com.example.AminalReport.entities.enums.EnumNivelUrgencia).values()}"
                                        th:unless="${n.name() == 'INSUFICIENTE'}"
                                        th:value="${n.name()}"
                                        th:text="${n.descricao}"
                                        th:selected="${denuncia.urgencia != null && denuncia.urgencia.name() == n.name()}">
                                </option>
                            </select>

                            <label for="motivoUrgencia" class="form-label">Motivo (opcional)</label>

                            <input type="text" class="form-control mb-3" id="motivoUrgencia" name="motivo"
                                   maxlength="200" placeholder="Ex.: confirmado em visita ao local">

                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-check2-circle me-2"></i>
                                Salvar correção
                            </button>

                        </form>

                    </div>

                </div>

                <!-- INFORMAÇÕES -->

                <div class="col-lg-7">

                    <div class="detail-info-card">

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

                            <h2 class="detail-section-title mb-0">
                                Informações da Denúncia
                            </h2>

                            <th:block th:replace="~{fragments/urgencia :: badge(${denuncia})}"></th:block>

                        </div>

                        <th:block th:replace="~{fragments/urgencia :: justificativa(${denuncia})}"></th:block>

                        <!-- TIPO -->

                        <div class="mb-4">

                            <label class="form-label form-label-custom">
                                Tipo do Animal
                            </label>

                            <div class="detail-field">

                                <span th:text="${denuncia.tipoAnimal.descricao}">
                                    Tipo
                                </span>

                            </div>

                        </div>

                        <!-- DESCRIÇÃO -->

                        <div class="mb-4">

                            <label class="form-label form-label-custom">
                                Descrição
                            </label>

                            <div class="detail-description-box">

                                <p class="mb-0"
                                   th:text="${denuncia.descricao}">

                                    Descrição detalhada aqui...

                                </p>

                            </div>

                        </div>

                        <!-- LOCALIZAÇÃO -->

                        <div th:if="${!denuncia.denunciaRapida}">

                            <hr class="detail-divider">

                            <h3 class="detail-section-title mt-4 mb-4">
                                Localização
                            </h3>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label form-label-custom">
                                        Estado
                                    </label>

                                    <div class="detail-field">
                                        <span th:text="${denuncia.estado}"></span>
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label form-label-custom">
                                        Cidade
                                    </label>

                                    <div class="detail-field">
                                        <span th:text="${denuncia.municipio}"></span>
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label form-label-custom">
                                        Bairro
                                    </label>

                                    <div class="detail-field">
                                        <span th:text="${denuncia.bairro}"></span>
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label form-label-custom">
                                        CEP
                                    </label>

                                    <div class="detail-field">
                                        <span th:text="${denuncia.cep}"></span>
                                    </div>

                                </div>

                                <div class="col-12">

                                    <label class="form-label form-label-custom">
                                        Rua
                                    </label>

                                    <div class="detail-field">
                                        <span th:text="${denuncia.rua}"></span>
                                    </div>

                                </div>

                                <div class="col-12">

                                    <label class="form-label form-label-custom">
                                        Ponto de Referência
                                    </label>

                                    <div class="detail-description-box small-box">

                                        <p class="mb-0"
                                           th:text="${denuncia.pontoRef}"></p>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- CONTATO EMERGÊNCIA -->

                        <div th:if="${denuncia.denunciaRapida}">

                            <hr class="detail-divider">

                            <h3 class="detail-section-title mt-4 mb-4">
                                Contato
                            </h3>

                            <div class="detail-field">

                                <span class="fw-bold"
                                      th:text="${denuncia.contato}">

                                    Contato

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
