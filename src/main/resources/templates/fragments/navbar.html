<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- Barra de navegação. Os links seguem as mesmas regras de perfil da tela inicial. -->
<nav class="navbar navbar-expand-lg app-navbar" th:fragment="navbar" aria-label="Navegação principal">
    <div class="container">

        <a class="app-brand" th:href="@{/home}">
            <img th:src="@{/images/image-removebg-preview.png}" alt="" class="navbar-logo">
            <span>Animal Report</span>
        </a>

        <button class="navbar-toggler ms-auto" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav app-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}"
                       th:classappend="${requestURI != null and requestURI == '/home'} ? 'active'">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/adocao/home}"
                       th:classappend="${requestURI != null and #strings.startsWith(requestURI, '/adocao')} ? 'active'">Adoção</a>
                </li>
                <li class="nav-item"
                    th:if="${usuarioLogado == null or usuarioLogado.tipoUsuario == 'Comum'}">
                    <a class="nav-link" th:href="@{/denuncia}"
                       th:classappend="${requestURI != null and requestURI == '/denuncia'} ? 'active'">Denunciar</a>
                </li>
                <li class="nav-item" th:if="${usuarioLogado != null}">
                    <a class="nav-link" th:href="@{/status}"
                       th:classappend="${requestURI != null and #strings.startsWith(requestURI, '/status')} ? 'active'">Denúncias</a>
                </li>
                <li class="nav-item"
                    th:if="${usuarioLogado != null and usuarioLogado.tipoUsuario == 'Comum'}">
                    <a class="nav-link nav-emergencia" th:href="@{/urgente}">Emergência</a>
                </li>
            </ul>

            <!-- LOGADO -->
            <div class="dropdown" th:if="${usuarioLogado != null}">
                <button class="btn dropdown-toggle d-flex align-items-center gap-2 user-dropdown-btn"
                        type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="navbar-avatar">
                        <img th:src="${fotoPerfil != null ? fotoPerfil : '/images/perfilPadrao.jpg'}" alt="Perfil">
                    </span>
                    <span class="navbar-user-text" th:text="${usuarioLogado.nome}">Usuário</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/entrar}">Trocar usuário</a></li>
                    <li><a class="dropdown-item" th:href="@{/alterarUsuario/{id}(id=${usuarioLogado.id})}">Alterar usuário</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" th:href="@{/logout}">Sair</a></li>
                </ul>
            </div>

            <!-- DESLOGADO -->
            <div class="d-flex align-items-center gap-2" th:if="${usuarioLogado == null}">
                <a th:href="@{/entrar}" class="app-btn-outline">Entrar</a>
                <a th:href="@{/registrar}" class="app-btn-light">Cadastrar</a>
            </div>

        </div>
    </div>
</nav>

</body>
</html>
