<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>AR - Login</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="body_login">

<main class="login-card">

    <div class="nav-cadastro">
        <img class="logo_img"
             th:src="@{/images/image-removebg-preview.png}"
             alt="Logo Animal Report"/>
        <h2>Animal Report</h2>
    </div>

    <h2 class="text-center mb-1">Bem-vindo de volta</h2>
    <p class="text-center text-secondary mb-4">Entre para acompanhar suas denúncias e adoções.</p>

    <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
        E-mail ou senha inválidos!
    </div>

    <div th:if="${param.loginRequired}" class="alert alert-warning text-center" role="alert">
        Você precisa estar logado para acessar esta página.
    </div>

    <div th:if="${param.logoutSuccess}" class="alert alert-success text-center" role="alert">
        Logout realizado com sucesso!
    </div>

    <form class="form_login" action="/entrar" method="POST">

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="voce@exemplo.com"
                   autocomplete="email"
                   required/>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-baseline">
                <label for="senha" class="form-label">Senha</label>
                <a class="msg_senha" href="#">Esqueceu a senha?</a>
            </div>
            <input type="password"
                   class="form-control"
                   id="senha"
                   name="senha"
                   placeholder="Sua senha"
                   autocomplete="current-password"
                   required/>
        </div>

        <button type="submit" class="form-main-btn w-100">Entrar</button>
    </form>

    <div class="divider-text">ou continue com</div>

    <div class="social-row">
        <div class="rounded-circle-apps bg-white p-2">
            <img th:src="@{/images/google-icon-isolated-white-background_1273375-828.avif}"
                 alt="Google"
                 class="rounded-circle-apps"/>
        </div>
        <div class="rounded-circle-apps bg-white p-2">
            <img th:src="@{/images/logotipo-do-facebook-em-um-circulo-azul_705838-12823.avif}"
                 alt="Facebook"
                 class="rounded-circle-apps"/>
        </div>
        <div class="rounded-circle-apps bg-white p-2">
            <img th:src="@{/images/apple.png}"
                 alt="Apple"
                 class="rounded-circle-apps"/>
        </div>
    </div>

    <div class="msg_botton text-center">
        <span>Não tem uma conta?</span>
        <a th:href="@{/registrar}" class="msg_senha fw-semibold">Cadastre-se</a>
    </div>

    <div class="text-center">
        <a class="msg_senha" th:href="@{/home}">Entrar como visitante</a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
