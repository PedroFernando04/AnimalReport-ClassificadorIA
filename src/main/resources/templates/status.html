<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Status</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="page-wrapper">
<div th:replace="~{fragments/alerta :: alerta}"></div>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="page-content">

    <section class="status-page">

        <div class="status-header">

            <h1 class="status-title">
                Suas Denúncias
            </h1>

            <p class="status-subtitle">
                Acompanhe o andamento das denúncias realizadas.
            </p>

        </div>

        <div class="status-card">

            <div th:if="${denuncias.isEmpty()}"
                 class="alert alert-secondary text-center mb-0">

                Nenhuma denúncia registrada ainda.

            </div>

            <div class="table-responsive"
                 th:unless="${denuncias.isEmpty()}">

                <table class="table status-table align-middle mb-0">

                    <thead>
                    <tr>
                        <th>Estado</th>
                        <th>Cidade</th>
                        <th>Bairro</th>
                        <th>Tipo</th>
                        <th>Urgência</th>
                        <th>Status</th>

                        <th th:if="${usuarioLogado != null}">
                            Ações
                        </th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="denuncia : ${denuncias}">

                        <td th:text="${denuncia.estado}"></td>

                        <td th:text="${denuncia.municipio}"></td>

                        <td th:text="${denuncia.bairro}"></td>

                        <td th:text="${denuncia.tipoAnimal.descricao}"></td>

                        <td>

                            <th:block th:replace="~{fragments/urgencia :: selo(${denuncia})}"></th:block>

                        </td>

                        <td>

                            <span class="pill"
                                  th:text="${denuncia.andamentoDenuncia.descricao}"
                                  th:classappend="${denuncia.andamentoDenuncia.name() == 'AGUARDANDO'} ? 'pill-urgente' :
                                    (${denuncia.andamentoDenuncia.name() == 'EM_ANALISE'} ? 'pill-nao' :
                                    (${denuncia.andamentoDenuncia.name() == 'CONCLUIDA'} ? 'pill-pouco' :
                                    (${denuncia.andamentoDenuncia.name() == 'REPROVADA'} ? 'pill-emergencia' : 'pill-neutro')))"></span>

                        </td>

                        <td th:if="${usuarioLogado != null}">

                            <div class="status-actions">

                                <a th:href="@{/status/detalhe/{id}(id=${denuncia.id})}"
                                   class="btn-status-primary">

                                    Ver mais

                                </a>

                                <a th:href="@{/status/editar/{id}(id=${denuncia.id})}"
                                   class="btn-status-warning"
                                th:if="${usuarioLogado.tipoUsuario == 'Comum'}">

                                    Alterar

                                </a>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
